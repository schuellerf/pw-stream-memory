# Optional pw-stream-memory Lua extension: restore by application.process.binary.
# Installed by `pw-stream-memory --install-lua-hook`. Restart WirePlumber after.

wireplumber.components = [
  {
    name = "pw-stream-memory.lua", type = script/lua
    provides = pw.stream-memory.hook
    wants = [ hooks.stream.state ]
    # Stock stream restore registers before the event source; we must run after
    # it so Plugin.find("standard-event-source") and default metadata exist.
    after = [ support.standard-event-source ]
  }
]

wireplumber.profiles = {
  main = {
    # required: WirePlumber's "optional" does not load the script at all.
    # A Lua error here will fail the profile; keep the script defensive.
    pw.stream-memory.hook = required
  }
}
