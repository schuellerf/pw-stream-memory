name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PNGs were regenerated from the SVG
        run: make check-pngs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Import package
        run: |
          python -m pip install dist/*.whl
          python -c "import pw_stream_memory; print(pw_stream_memory.__version__)"
          pw-stream-memory --help
